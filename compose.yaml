services:
  unbound:
    image: mtl-unbound:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      - ROOT_NS_IP=192.168.1.50
      - TRUST_ANCHOR=.    IN      DS      63360 13 2 20b959215ab37d04d58b18f2f910d4a920ec6582037875fb9d2d033727a2d20f
    hostname: unbound
    networks:
      serviceNet:
        ipv4_address: "192.168.1.51"
    ports:
      - "5553:5553/udp"
      - "5553:5553/tcp"
    tmpfs:
      - /tmp

  nsd:
    image: mtl-nsd:latest
    volumes:
      - ./zones:/var/nsd/data/zones
    networks:
      serviceNet:
        ipv4_address: "192.168.1.50"
    ports:
      - "53:53/udp"
      - "53:53/tcp"

networks:
  serviceNet:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.1.0/24
    internal: true # Isolate this network from the hosts external network